<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Krafttraining Tracker</title>
<style>
  :root{
    --bg:#121212;
    --bg-card:#1e1e1e;
    --bg-card-2:#262626;
    --text:#f2f2f2;
    --text-dim:#a0a0a0;
    --accent:#4caf7d;
    --accent-2:#2f8f5f;
    --danger:#e05c5c;
    --border:#333;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:18px;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .screen{display:none;padding:16px 16px 48px;max-width:640px;margin:0 auto;}
  .screen.active{display:block;}

  header.top{
    display:flex;align-items:center;gap:12px;
    padding:16px 0 8px;
  }
  header.top h1{
    font-size:1.5rem;margin:0;flex:1;
  }
  .back-btn{
    min-width:44px;min-height:44px;
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1.3rem;
    display:flex;align-items:center;justify-content:center;
  }

  .day-timer{
    text-align:center;
    font-size:1.4rem;font-weight:700;
    color:var(--accent);
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    margin-bottom:16px;
    letter-spacing:1px;
  }

  .export-btn{
    display:block;width:100%;min-height:52px;
    background:var(--bg-card-2);
    color:var(--accent);
    border:1px solid var(--accent-2);
    border-radius:12px;
    font-size:1.05rem;font-weight:600;
    margin-bottom:6px;
  }
  .export-hint{
    color:var(--text-dim);font-size:.8rem;
    text-align:center;margin:0 0 20px;
  }

  .day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .day-btn{
    min-height:110px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:16px;
    color:var(--text);
    font-size:1.3rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:10px;
  }
  .day-btn:active{background:var(--bg-card-2);}

  .exercise{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:16px;
  }
  .exercise-name-btn{
    display:block;width:100%;text-align:left;
    background:none;border:none;color:var(--text);
    font-size:1.15rem;font-weight:700;
    padding:6px 0;
    min-height:44px;
  }
  .exercise-name-btn .hint{
    display:block;font-size:.8rem;font-weight:400;color:var(--text-dim);
    margin-top:2px;
  }
  .target{
    color:var(--text-dim);
    font-size:.95rem;
    margin:0 0 10px;
  }

  .set-row{
    display:flex;align-items:center;gap:8px;
    margin-bottom:10px;
  }
  .set-label{
    width:26px;flex:none;color:var(--text-dim);font-size:.95rem;text-align:center;
  }
  .set-row input{
    flex:1;min-height:48px;
    background:var(--bg-card-2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:1.1rem;
    padding:0 10px;
    min-width:0;
  }
  .set-row input:focus{
    outline:2px solid var(--accent);
    border-color:var(--accent);
  }
  .copy-btn{
    flex:none;width:44px;min-height:44px;
    background:var(--bg-card-2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--accent);
    font-size:1rem;font-weight:700;
    padding:0;
  }
  .copy-btn:active{background:var(--accent-2);color:#fff;}
  .check{
    width:30px;flex:none;text-align:center;
    font-size:1.4rem;color:var(--accent);
    visibility:hidden;
  }
  .check.show{visibility:visible;}

  .add-set-btn{
    display:block;width:100%;min-height:44px;
    background:none;
    border:1px dashed var(--border);
    border-radius:10px;
    color:var(--text-dim);
    font-size:1rem;font-weight:600;
    margin-top:4px;
  }
  .add-set-btn:active{background:var(--bg-card-2);color:var(--text);}

  .finish-btn{
    display:block;width:100%;min-height:56px;
    background:var(--accent);
    color:#0b1a12;
    border:none;border-radius:14px;
    font-size:1.15rem;font-weight:700;
    margin-top:8px;
  }
  .finish-btn:active{background:var(--accent-2);}

  .history-item{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .history-date{
    font-weight:700;margin-bottom:6px;
  }
  .history-day{
    color:var(--text-dim);font-size:.85rem;margin-bottom:6px;
  }
  .history-sets{color:var(--text);font-size:1rem;line-height:1.5;}
  .empty-msg{color:var(--text-dim);text-align:center;margin-top:40px;}

  .toast{
    position:fixed;left:16px;right:16px;bottom:24px;
    background:var(--accent);color:#0b1a12;
    padding:14px 16px;border-radius:12px;
    font-weight:700;text-align:center;
    max-width:640px;margin:0 auto;
    display:none;
    z-index:50;
  }
  .toast.show{display:block;}
</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <header class="top"><h1>Krafttraining</h1></header>
  <button class="export-btn" id="btn-export">⭳ Exportieren (CSV)</button>
  <p class="export-hint">Enthält immer deinen kompletten bisherigen Verlauf</p>
  <div class="day-grid">
    <button class="day-btn" data-day="upper-a">Upper A</button>
    <button class="day-btn" data-day="lower-a">Lower A</button>
    <button class="day-btn" data-day="upper-b">Upper B</button>
    <button class="day-btn" data-day="lower-b">Lower B</button>
  </div>
</div>

<!-- DAY -->
<div id="screen-day" class="screen">
  <header class="top">
    <button class="back-btn" id="btn-day-back">←</button>
    <h1 id="day-title">Tag</h1>
  </header>
  <div class="day-timer" id="day-timer">⏱ 00:00</div>
  <div id="day-exercises"></div>
  <button class="finish-btn" id="btn-finish">Training abschließen</button>
</div>

<!-- HISTORY -->
<div id="screen-history" class="screen">
  <header class="top">
    <button class="back-btn" id="btn-history-back">←</button>
    <h1 id="history-title">Verlauf</h1>
  </header>
  <div id="history-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Trainingsplan-Daten ---------- */
const TRAINING_PLAN = {
  "upper-a": {
    name: "Upper A",
    exercises: [
      { name: "Schrägbankdrücken Kurzhantel", sets: 4, repsMin: 6, repsMax: 10 },
      { name: "Latzug breit", sets: 3, repsMin: 8, repsMax: 12 },
      { name: "Brustgestütztes Rudern", sets: 3, repsMin: 8, repsMax: 12 },
      { name: "Kabel-Fly (tiefe Dehnung)", sets: 3, repsMin: 10, repsMax: 15 },
      { name: "Trizeps Seil (Kabel-Triset)", sets: 3, repsMin: 10, repsMax: 15 },
      { name: "Bizeps-Curl (Kabel-Triset)", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Seitheben Kabel (Kabel-Triset)", sets: 4, repsMin: 12, repsMax: 15 }
    ]
  },
  "lower-a": {
    name: "Lower A",
    exercises: [
      { name: "Beinpresse", sets: 4, repsMin: 8, repsMax: 10 },
      { name: "Hip Thrust", sets: 3, repsMin: 8, repsMax: 12 },
      { name: "Beinbeuger sitzend", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Wadenheben stehend", sets: 3, repsMin: 12, repsMax: 15 },
      { name: "Seitheben Kabel Lean-Away", sets: 4, repsMin: 12, repsMax: 15 },
      { name: "Bizeps-Curl", sets: 3, repsMin: 10, repsMax: 12 }
    ]
  },
  "upper-b": {
    name: "Upper B",
    exercises: [
      { name: "Flachbankdrücken Kurzhantel", sets: 4, repsMin: 8, repsMax: 10 },
      { name: "Klimmzug (assistiert) / Latzug eng", sets: 3, repsMin: 8, repsMax: 10 },
      { name: "Kabelrudern eng", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Enges Bankdrücken (schulterbreit)", sets: 4, repsMin: 8, repsMax: 12 },
      { name: "Face Pull", sets: 3, repsMin: 12, repsMax: 20 },
      { name: "Überkopf-Trizeps (Kabel-Triset)", sets: 3, repsMin: 10, repsMax: 15 },
      { name: "Hammer-Curls (Kabel-Triset)", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Seitheben Kabel (Kabel-Triset)", sets: 3, repsMin: 12, repsMax: 15 }
    ]
  },
  "lower-b": {
    name: "Lower B",
    exercises: [
      { name: "Rumänisches Kreuzheben", sets: 4, repsMin: 8, repsMax: 10 },
      { name: "Beinpresse, Füße tief", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Beinstrecker", sets: 3, repsMin: 12, repsMax: 15 },
      { name: "Beinbeuger sitzend", sets: 3, repsMin: 10, repsMax: 12 },
      { name: "Wadenheben sitzend", sets: 3, repsMin: 12, repsMax: 15 },
      { name: "Seitheben Kurzhantel", sets: 4, repsMin: 12, repsMax: 15 },
      { name: "Trizeps Seil", sets: 3, repsMin: 10, repsMax: 15 },
      { name: "Reverse Crunch", sets: 3, repsMin: 12, repsMax: 12 }
    ]
  }
};

const STORAGE_PREFIX = "training:";

/* ---------- Storage-Hilfsfunktionen ---------- */
function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function saveSession(daySlug, dayName, exercises){
  const date = todayISO();
  const key = `${STORAGE_PREFIX}${date}:${daySlug}`;
  const data = { date, daySlug, dayName, exercises };
  localStorage.setItem(key, JSON.stringify(data));
}

function getAllSessions(){
  const sessions = [];
  for (let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if (!key || key.indexOf(STORAGE_PREFIX) !== 0) continue;
    try{
      const data = JSON.parse(localStorage.getItem(key));
      if (data && data.date) sessions.push(data);
    }catch(e){ /* defekten Eintrag ignorieren */ }
  }
  sessions.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  return sessions;
}

function getHistoryForExercise(exerciseName){
  const sessions = getAllSessions();
  const result = [];
  for (const s of sessions){
    const ex = s.exercises.find(e => e.name === exerciseName);
    if (ex) result.push({ date: s.date, dayName: s.dayName, sets: ex.sets });
  }
  result.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
  return result;
}

function getLastSetsForExercise(exerciseName){
  const hist = getHistoryForExercise(exerciseName);
  return hist.length ? hist[0].sets : null;
}

/* ---------- Trainings-Timer ---------- */
let dayTimerInterval = null;

function timerKeyFor(daySlug){
  return `timer:${daySlug}`;
}

function formatElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const pad = n => String(n).padStart(2,"0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function startDayTimer(daySlug){
  const key = timerKeyFor(daySlug);
  let start = localStorage.getItem(key);
  if (!start){
    start = Date.now();
    localStorage.setItem(key, String(start));
  } else {
    start = parseInt(start, 10);
  }
  const el = document.getElementById("day-timer");
  function tick(){
    el.textContent = "⏱ " + formatElapsed(Date.now() - start);
  }
  tick();
  if (dayTimerInterval) clearInterval(dayTimerInterval);
  dayTimerInterval = setInterval(tick, 1000);
}

function stopDayTimerDisplay(){
  if (dayTimerInterval){
    clearInterval(dayTimerInterval);
    dayTimerInterval = null;
  }
}

function clearDayTimer(daySlug){
  localStorage.removeItem(timerKeyFor(daySlug));
  stopDayTimerDisplay();
}

/* ---------- Navigation ---------- */
const screens = {
  home: document.getElementById("screen-home"),
  day: document.getElementById("screen-day"),
  history: document.getElementById("screen-history")
};
let historyReturnScreen = "home";

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo(0,0);
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Tages-Ansicht ---------- */
function repsLabel(ex){
  return ex.repsMin === ex.repsMax ? `${ex.repsMin}` : `${ex.repsMin}–${ex.repsMax}`;
}

function addSetRow(setsContainer, lastSets, rowIndex){
  const row = document.createElement("div");
  row.className = "set-row";

  const label = document.createElement("span");
  label.className = "set-label";
  label.textContent = (rowIndex+1) + ".";
  row.appendChild(label);

  const weightInput = document.createElement("input");
  weightInput.type = "number";
  weightInput.inputMode = "decimal";
  weightInput.step = "0.5";
  weightInput.min = "0";
  weightInput.dataset.role = "weight";
  if (lastSets && lastSets[rowIndex] && lastSets[rowIndex].weight !== undefined && lastSets[rowIndex].weight !== ""){
    weightInput.placeholder = `${lastSets[rowIndex].weight} kg`;
  } else {
    weightInput.placeholder = "kg";
  }
  weightInput.addEventListener("focus", () => weightInput.select());
  row.appendChild(weightInput);

  if (rowIndex > 0){
    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "=";
    copyBtn.title = "Gewicht vom Satz darüber übernehmen";
    copyBtn.addEventListener("click", () => {
      let sibling = row.previousElementSibling;
      while (sibling){
        const prevWeight = sibling.querySelector('input[data-role="weight"]');
        if (prevWeight && prevWeight.value.trim() !== ""){
          weightInput.value = prevWeight.value;
          weightInput.dispatchEvent(new Event("input"));
          break;
        }
        sibling = sibling.previousElementSibling;
      }
    });
    row.appendChild(copyBtn);
  }

  const repsInput = document.createElement("input");
  repsInput.type = "number";
  repsInput.inputMode = "numeric";
  repsInput.pattern = "[0-9]*";
  repsInput.min = "0";
  repsInput.placeholder = "Wdh";
  repsInput.dataset.role = "reps";
  repsInput.addEventListener("focus", () => repsInput.select());
  row.appendChild(repsInput);

  const check = document.createElement("span");
  check.className = "check";
  check.textContent = "✓";
  row.appendChild(check);

  function updateCheck(){
    const filled = weightInput.value.trim() !== "" && repsInput.value.trim() !== "";
    check.classList.toggle("show", filled);
  }
  weightInput.addEventListener("input", updateCheck);
  repsInput.addEventListener("input", updateCheck);
  updateCheck();

  setsContainer.appendChild(row);
}

function openDay(daySlug){
  const day = TRAINING_PLAN[daySlug];
  document.getElementById("day-title").textContent = day.name;
  document.getElementById("screen-day").dataset.daySlug = daySlug;
  const container = document.getElementById("day-exercises");
  container.innerHTML = "";

  day.exercises.forEach((ex) => {
    const lastSets = getLastSetsForExercise(ex.name);

    const box = document.createElement("div");
    box.className = "exercise";
    box.dataset.name = ex.name;

    const nameBtn = document.createElement("button");
    nameBtn.className = "exercise-name-btn";
    nameBtn.innerHTML = ex.name + '<span class="hint">Verlauf ansehen ›</span>';
    nameBtn.addEventListener("click", () => openHistory(ex.name, "day"));
    box.appendChild(nameBtn);

    const target = document.createElement("p");
    target.className = "target";
    target.textContent = `Ziel: ${ex.sets} × ${repsLabel(ex)} Wdh`;
    box.appendChild(target);

    const setsContainer = document.createElement("div");
    setsContainer.className = "sets-container";
    box.appendChild(setsContainer);

    for (let i=0; i<ex.sets; i++){
      addSetRow(setsContainer, lastSets, i);
    }

    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-set-btn";
    addBtn.textContent = "+ Satz hinzufügen";
    addBtn.addEventListener("click", () => {
      addSetRow(setsContainer, lastSets, setsContainer.children.length);
    });
    box.appendChild(addBtn);

    container.appendChild(box);
  });

  startDayTimer(daySlug);
  showScreen("day");
}

function finishDay(daySlug){
  const day = TRAINING_PLAN[daySlug];
  const resultExercises = [];

  document.querySelectorAll("#day-exercises .exercise").forEach(box => {
    const sets = [];
    box.querySelectorAll(".set-row").forEach(row => {
      const w = row.querySelector('input[data-role="weight"]').value.trim();
      const r = row.querySelector('input[data-role="reps"]').value.trim();
      if (w !== "" && r !== ""){
        sets.push({ weight: w, reps: r });
      }
    });
    if (sets.length){
      resultExercises.push({ name: box.dataset.name, sets });
    }
  });

  if (!resultExercises.length){
    alert("Bitte trage mindestens einen vollständigen Satz (Gewicht + Wiederholungen) ein.");
    return;
  }

  saveSession(daySlug, day.name, resultExercises);
  clearDayTimer(daySlug);
  showToast("Training gespeichert ✓");
  showScreen("home");
}

/* ---------- Verlaufs-Ansicht ---------- */
function openHistory(exerciseName, fromScreen){
  historyReturnScreen = fromScreen;
  document.getElementById("history-title").textContent = exerciseName;
  const list = document.getElementById("history-list");
  list.innerHTML = "";

  const hist = getHistoryForExercise(exerciseName);
  if (!hist.length){
    const p = document.createElement("p");
    p.className = "empty-msg";
    p.textContent = "Noch keine gespeicherten Trainings für diese Übung.";
    list.appendChild(p);
  } else {
    hist.forEach(entry => {
      const item = document.createElement("div");
      item.className = "history-item";

      const date = document.createElement("div");
      date.className = "history-date";
      date.textContent = entry.date;
      item.appendChild(date);

      const dayName = document.createElement("div");
      dayName.className = "history-day";
      dayName.textContent = entry.dayName;
      item.appendChild(dayName);

      const sets = document.createElement("div");
      sets.className = "history-sets";
      sets.textContent = entry.sets.map((s,i) => `Satz ${i+1}: ${s.weight}kg × ${s.reps}`).join(" · ");
      item.appendChild(sets);

      list.appendChild(item);
    });
  }

  showScreen("history");
}

/* ---------- CSV-Export ---------- */
function csvEscape(value){
  const str = String(value);
  if (/[",\n]/.test(str)){
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

/* Merkt sich (nur auf Browsern mit File System Access API, z.B. Desktop-Chrome/Edge)
   einen Datei-Handle in IndexedDB, damit jeder Export dieselbe Datei überschreibt
   statt eine neue Download-Datei anzulegen. Auf iPhone/Safari nicht verfügbar ->
   dort greift automatisch der klassische Download-Fallback weiter unten. */
const FS_DB_NAME = "gym-tracker-fs";
const FS_STORE_NAME = "handles";
const FS_HANDLE_KEY = "csv-export";

function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(FS_STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getStoredFileHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(FS_STORE_NAME, "readonly");
      const req = tx.objectStore(FS_STORE_NAME).get(FS_HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){
    return null;
  }
}

async function storeFileHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(FS_STORE_NAME, "readwrite");
      tx.objectStore(FS_STORE_NAME).put(handle, FS_HANDLE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    /* ignorieren, Export funktioniert trotzdem über den Fallback */
  }
}

function downloadCSVFallback(csvContent){
  const blob = new Blob(["﻿" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "trainingsdaten-export.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function exportCSV(){
  const sessions = getAllSessions();
  const rows = [["Datum","Trainingstag","Übung","Satz-Nummer","Gewicht (kg)","Wiederholungen"]];

  sessions.forEach(s => {
    s.exercises.forEach(ex => {
      ex.sets.forEach((set, i) => {
        rows.push([s.date, s.dayName, ex.name, i+1, set.weight, set.reps]);
      });
    });
  });

  if (rows.length === 1){
    alert("Es sind noch keine Trainingsdaten gespeichert.");
    return;
  }

  const csvContent = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");

  if (window.showSaveFilePicker){
    try{
      let handle = await getStoredFileHandle();
      if (handle){
        const opts = { mode: "readwrite" };
        let perm = await handle.queryPermission(opts);
        if (perm !== "granted") perm = await handle.requestPermission(opts);
        if (perm !== "granted") handle = null;
      }
      if (!handle){
        handle = await window.showSaveFilePicker({
          suggestedName: "trainingsdaten-export.csv",
          types: [{ description: "CSV-Datei", accept: { "text/csv": [".csv"] } }]
        });
        await storeFileHandle(handle);
      }
      const writable = await handle.createWritable();
      await writable.write("﻿" + csvContent);
      await writable.close();
      showToast("Datei aktualisiert ✓");
      return;
    }catch(e){
      if (e && e.name === "AbortError") return;
      /* API fehlgeschlagen -> unten regulärer Download als Fallback */
    }
  }

  downloadCSVFallback(csvContent);
}

/* ---------- Event-Listener ---------- */
document.querySelectorAll(".day-btn").forEach(btn => {
  btn.addEventListener("click", () => openDay(btn.dataset.day));
});
document.getElementById("btn-export").addEventListener("click", exportCSV);
document.getElementById("btn-finish").addEventListener("click", () => {
  finishDay(document.getElementById("screen-day").dataset.daySlug);
});
document.getElementById("btn-day-back").addEventListener("click", () => {
  stopDayTimerDisplay();
  showScreen("home");
});
document.getElementById("btn-history-back").addEventListener("click", () => showScreen(historyReturnScreen));

})();
</script>
</body>
</html>
